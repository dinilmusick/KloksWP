name: CI
on: [push,pull_request]
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: php tools/validate.php
      - run: php tests/canonical-services.php
      - run: php tests/utilities.php
      - run: php tests/storage-metadata.php
      - run: php tests/http-failclosed.php
      - run: php tests/connectivity-failclosed.php
      - run: php tests/workspace-capabilities.php
      - run: php tests/fod-dag.php
